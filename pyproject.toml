# pyproject.toml

# ==============================================================================
# 1. Ruff (Linter & Formatter) Configuration
# ==============================================================================
[tool.ruff]
# 대상 파이썬 버전 지정 (GitLab CI 환경 및 로컬 환경과 일치)
target-version = "py311"

# 실무 QA 환경에 맞춘 여유로운 줄 길이 (기본 88자 -> 119자 확장)
line-length = 119

# 검사에서 제외할 폴더 및 파일
exclude = [
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    "__pycache__",
    "reports",
    "downloads",
    "dist",
    "build",
    "htmlcov"
]

[tool.ruff.lint]
# 적용할 검사 규칙 지정
# E: pycodestyle (들여쓰기, 공백 등 PEP 8 스타일)
# F: Pyflakes (문법 오류, 정의되지 않은 변수, 사용하지 않는 Import)
# I: isort (Import 문 알파벳 순 및 패키지 그룹별 자동 정렬)
# W: Warnings (기타 경고)
# B: flake8-bugbear (잠재적 버그 탐지)
# SIM: flake8-simplify (코드 단순화)
# UP: pyupgrade (최신 파이썬 문법 적용)
# C4: flake8-comprehensions (리스트/딕셔너리 컴프리헨션 최적화)
# RET: flake8-return (Return 문 최적화)
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "RET"]

# 팀 합의하에 명시적으로 무시할 규칙 정의
ignore = [
    "B008",  # 함수 인자의 디폴트 값으로 함수 호출 허용 (FastAPI나 Pydantic에서 주로 사용)
]

[tool.ruff.lint.per-file-ignores]
# 파일 특성에 따른 예외 규칙 적용
"tests/*" = ["S101"]         # 테스트 코드 내에서는 파이썬 내장 assert 사용 허용
"conftest.py" = ["ARG001"]   # Fixture에서 사용하지 않는 인자 경고 무시

[tool.ruff.lint.isort]
# First-party 패키지를 인식하여 Import 구문을 더욱 깔끔하게 그룹핑 (자동 정렬)
known-first-party = ["api", "builders", "core", "fixtures", "hooks", "pages", "services", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false


# ==============================================================================
# 2. Mypy (Static Type Checker) Configuration
# ==============================================================================
[tool.mypy]
python_version = "3.11"
# 엔터프라이즈급 프로젝트를 위한 엄격한 타입 체킹 모드 활성화
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true

# 타입 체킹에서 제외할 디렉터리 (주로 외부 라이브러리가 생성하는 폴더)
exclude = [
    "venv",
    ".venv",
    "reports",
    "downloads"
]