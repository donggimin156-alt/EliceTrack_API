# pytest.ini

[pytest]
# ==========================================
# 1. 테스트 탐색 규칙 (Test Discovery)
# ==========================================
# Pytest가 테스트 파일을 찾을 경로와 파일명 규칙을 정의합니다.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ==========================================
# 2. 전역 실행 옵션 (Execution Options)
# ==========================================
# 브라우저/환경/xdist(병렬) 옵션 등 가변적인 값은 CLI나 배치 스크립트에서 주입하며,
# 여기서는 항상 적용되어야 할 필수(안전) 옵션만 고정으로 정의합니다.
addopts = 
    -v
    --strict-markers
    --strict-config

# ==========================================
# 3. 리포팅 포맷 지정 (Reporting Formats)
# ==========================================
# CI/CD 서버(GitLab, Jenkins 등)에서 테스트 결과를 파싱할 때 사용하는 호환 포맷입니다.
junit_family = xunit2

# ==========================================
# 4. 커스텀 마커 (Custom Markers)
# ==========================================
# --strict-markers 옵션에 의해 이곳에 정의되지 않은 마커를 사용하면 에러가 발생합니다.
markers =
    smoke: 핵심 비즈니스 로직이 정상 작동하는지 확인하는 스모크 테스트
    regression: 전체 기능의 무결성을 확인하는 회귀 테스트
    ui: UI(Selenium WebDriver) 기반 테스트 그룹
    api: API(Requests) 기반 테스트 그룹
    p0: 최상위 중요도 (Critical / Showstopper)
    p1: 높음 중요도 (High)
    integration: 다중 컴포넌트가 연계된 통합 테스트
    e2e: 프론트엔드부터 DB까지 관통하는 엔드 투 엔드 테스트
    db: 데이터베이스 정합성을 직접 교차 검증하는 테스트
    board: Elice 게시판(Board) API 테스트 그룹
    learner: 학습자 계정 기준 시나리오
    educator: 교육자(기관 관리자) 계정 기준 시나리오
    class_lecture: Elice 학습목록(퀴즈) API 테스트
    bug: 알려진 결함 재현 테스트
    security: 보안 결함(XSS·정보노출 등) 테스트
    schedule: 수업 일정 API 테스트 그룹

# ==========================================
# 5. 경고 필터 (Warnings Filter)
# ==========================================
# 서드파티 라이브러리 업데이트 등으로 인해 발생하는 통제 불가능한 경고를 무시합니다.
filterwarnings =
    ignore::DeprecationWarning:urllib3.*
    ignore::UserWarning

# ==========================================
# 6. 콘솔 로깅 (Console Logging)
# ==========================================
# 병렬 테스트(xdist) 디버깅을 위해 포맷에 워커 프로세스 ID(%(process)d)를 명시합니다.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(process)d] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ==========================================
# 7. 파일 로깅 (File Logging)
# ==========================================
# 콘솔보다 더 상세한 디버그(DEBUG) 레벨의 로그를 별도 파일로 누적 저장합니다.
log_file = reports/test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(process)d] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S