# docker-compose.yml
version: '3.8'

services:
  # [1] Selenium Standalone Chrome 컨테이너 (실제 UI 테스트가 구동되는 브라우저 노드)
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: qa-selenium-chrome
    shm_size: "2gb"  # 브라우저 메모리 부족으로 인한 크래시 방지
    ports:
      - "4444:4444"  # WebDriver 통신 포트
      - "7900:7900"  # VNC 실시간 모니터링 포트 (웹 브라우저 접속, 비밀번호: secret)
    environment:
      - SE_NODE_MAX_SESSIONS=4  # xdist 병렬 실행 워커 수에 맞춘 최대 세션 확장
    healthcheck:
      # 컨테이너 실행뿐만 아니라, 실제 Grid 서버가 트래픽을 받을 준비가 되었는지 확인합니다.
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 5

  # [2] QA Automation Framework 컨테이너 (Pytest 실행기)
  qa-framework:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: qa-framework
    depends_on:
      selenium-chrome:
        condition: service_healthy  # Grid가 완전히 준비된 후 테스트가 시작되도록 보장
    environment:
      - GRID_URL=http://selenium-chrome:4444
      - TEST_ENV=qa
    volumes:
      # 테스트 결과물과 다운로드 파일을 호스트 PC와 동기화하여 보존
      - ./reports:/app/reports
      - ./downloads:/app/downloads
      - ./.env:/app/.env
    tty: true  # 콘솔 로그 색상 유지