# .gitlab-ci.yml

# Python과 Chrome이 기본 탑재된 이미지를 사용하여 매 빌드 시 설치되는 오버헤드를 단축합니다.
# (실무에서는 보안과 속도를 위해 사내 Docker Registry에 캐싱된 이미지를 사용하는 것을 권장합니다.)
image: joyzoursky/python-chromedriver:3.11

stages:
  - lint     # 정적 분석 및 포맷팅 검사
  - test     # 자동화 테스트 실행 (API / UI 병렬)
  - report   # Allure 리포트 생성
  - deploy   # 결과 리포트 웹 호스팅 (GitLab Pages)

# 전역(Global) 변수 설정
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TEST_ENV: "qa"
  HTTP_POOL_SIZE: "50"
  
  # CI 환경에서는 테스트 실패 시 자동으로 Jira 버그 티켓을 생성하도록 활성화합니다.
  ENABLE_JIRA_AUTO_BUG: "true"
  
  # Allure CLI 자동 다운로드를 위한 버전 명시
  ALLURE_VERSION: "2.27.0"

# 매 빌드마다 패키지를 다시 다운받지 않도록 캐시를 구성합니다.
cache:
  paths:
    - .cache/pip

# ==========================================
# 1. 정적 분석 (Lint)
# ==========================================
lint_code:
  stage: lint
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - ruff check .
    - ruff format --check .
  rules:
    # Merge Request(PR)가 올라오거나, 메인 브랜치에 코드가 푸시될 때만 엄격하게 검사합니다.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==========================================
# 2. 자동화 테스트 (API와 UI를 분리하여 병렬 실행)
# ==========================================
.test_base: &test_base
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  artifacts:
    when: always
    paths:
      - reports/allure-results/
    # Allure 결과 데이터 자체는 최종 HTML을 만들고 나면 불필요하므로 보관 주기를 짧게(1일) 잡습니다.
    expire_in: 1 days 

# 2-1. API 테스트 (실행 속도가 빠름)
test_api:
  <<: *test_base
  script:
    # xdist(-n auto)를 통해 컨테이너의 가용 코어 수만큼 병렬로 API 테스트를 실행합니다.
    - pytest tests/api/ -n auto --alluredir=reports/allure-results
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 2-2. UI 테스트 (실행 속도가 느리며 Chrome 브라우저 필요)
test_ui:
  <<: *test_base
  script:
    # UI 테스트는 화면 렌더링이 필요 없도록 --headless 옵션을 강제 주입합니다.
    - pytest tests/ui/ -n auto --alluredir=reports/allure-results --headless
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==========================================
# 3. Allure 리포트 생성 및 트렌드(History) 누적
# ==========================================
generate_allure_report:
  stage: report
  image: openjdk:11-jre-slim # Allure는 Java 기반이므로 JRE 전용 이미지를 사용합니다.
  needs:
    - job: test_api
      artifacts: true
    - job: test_ui
      artifacts: true
  before_script:
    # Allure CLI 런타임 설치
    - curl -o allure-${ALLURE_VERSION}.tgz -Ls https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz
    - tar -zxvf allure-${ALLURE_VERSION}.tgz -C /opt/
    - ln -s /opt/allure-${ALLURE_VERSION}/bin/allure /usr/bin/allure
  script:
    # 이전 배포된 리포트에서 history 폴더를 가져와 트렌드 그래프를 유지합니다. (최초 실행 시 에러 무시)
    - curl -L https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}/-/jobs/artifacts/main/download?job=pages -o pages.zip || true
    - unzip pages.zip || true
    - cp -r public/history reports/allure-results/history || true
    
    # JSON 결과를 기반으로 화려한 HTML 리포트(public 폴더)를 생성합니다.
    - allure generate reports/allure-results -o public --clean
  artifacts:
    paths:
      - public/
    expire_in: 1 days
  rules:
    - when: always

# ==========================================
# 4. GitLab Pages로 HTML 웹 호스팅
# ==========================================
pages:
  stage: deploy
  needs:
    - job: generate_allure_report
      artifacts: true
  script:
    - echo "Deploying Allure Report to GitLab Pages..."
  artifacts:
    paths:
      - public # GitLab Pages는 무조건 'public' 폴더 내부의 파일을 호스팅합니다.
  rules:
    # 메인 브랜치에서 실행된 파이프라인의 결과만 공식 리포트 웹페이지에 업데이트합니다.
    - if: '$CI_COMMIT_BRANCH == "main"'